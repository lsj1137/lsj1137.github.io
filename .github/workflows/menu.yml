name: fetch-menu

on:
  workflow_dispatch:
  # 매주 월요일 KST 06:30 (UTC 일요일 21:30) - 그 주 월~금을 받는다
  schedule:
    - cron: '30 21 * * 0'

permissions:
  contents: write

concurrency:
  group: fetch-menu
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch menu
        env:
          MENU_BASE_URL: ${{ secrets.MENU_BASE_URL }}
          MENU_USER_ID: ${{ secrets.MENU_USER_ID }}
          MENU_USER_PW: ${{ secrets.MENU_USER_PW }}
          MENU_SITE_CD: ${{ secrets.MENU_SITE_CD }}
        run: node scripts/fetch-menu.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lunch/menu.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update menu"
            git push
          fi
