name: render-stats

on:
  workflow_dispatch:
  # 매일 KST 06:00 (UTC 21:00)
  schedule:
    - cron: '0 21 * * *'
  push:
    branches: [main]
    paths:
      - scripts/render-stats.mjs
      - scripts/render-dashboard.mjs
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: render-stats
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: lsj1137/github-readme-stats
          path: .readme-stats

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install readme-stats
        run: npm ci --omit=dev --ignore-scripts --prefix .readme-stats

      - name: Render cards
        env:
          # Classic PAT 필요. 기본 GITHUB_TOKEN·Fine-grained(Public repos)는 저장소 star 조회가 FORBIDDEN 으로 막힌다.
          PAT_1: ${{ secrets.STATS_PAT }}
        run: node scripts/render-stats.mjs .readme-stats stats

      - name: Render dashboard
        env:
          STATS_TOKEN: ${{ secrets.STATS_PAT }}
        run: node scripts/render-dashboard.mjs stats

      # 기여 잔디를 뱀이 먹는 애니메이션
      - name: Render snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: lsj1137
          outputs: |
            stats/snake-light.svg
            stats/snake-dark.svg?palette=github-dark

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update stats cards"
            git pull --rebase
            git push
          fi
