name: render-dashboard

on:
  workflow_dispatch:
  # 매일 KST 06:00 (UTC 21:00)
  schedule:
    - cron: '0 21 * * *'
  push:
    branches: [main]
    paths:
      - scripts/render-dashboard.mjs
      - scripts/render-solvedac.mjs
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: render-dashboard
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render dashboard
        env:
          # Classic PAT 필요. 기본 GITHUB_TOKEN 은 다른 저장소 정보 조회가 막힌다.
          STATS_TOKEN: ${{ secrets.STATS_PAT }}
        run: node scripts/render-dashboard.mjs stats

      # solved.ac 는 Cloudflare 가 가끔 막는다. 실패해도 기존 SVG를 두고 대시보드 커밋은 진행한다.
      - name: Render solved.ac
        continue-on-error: true
        run: node scripts/render-solvedac.mjs stats

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update dashboard"
            git pull --rebase
            git push
          fi
