<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>간사이 조이패스 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  :root{
    --bg:#ffffff;--soft:#f4f4f2;--ink:#1d1d1f;--sub:#7a7a80;--line:#ececea;
    --accent:#e8590c;--accent-soft:#fff1e8;--radius:16px;
    --shadow:0 8px 30px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;color:var(--ink);background:var(--soft)}
  button{font:inherit;color:inherit}
  #map{position:fixed;inset:0;z-index:0}

  /* 패널: 데스크톱=좌측 플로팅, 모바일=바텀시트 */
  #side{position:fixed;z-index:500;background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  #head{flex:none;padding:6px 14px 10px;border-bottom:1px solid var(--line);touch-action:none}
  .grip{display:none;width:40px;height:5px;border-radius:3px;background:#d6d6d3;margin:4px auto 8px}
  .titlebar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
  h1{font-size:17px;margin:0;letter-spacing:-.3px}
  h1 small{font-weight:500;color:var(--sub);font-size:12px;margin-left:6px}
  .tools{display:flex;gap:4px}
  .ibtn{width:34px;height:34px;border:0;border-radius:10px;background:var(--soft);cursor:pointer;font-size:15px;display:grid;place-items:center}
  .ibtn.on{background:#fff4d6;color:#d18b00}

  .search{position:relative}
  .search input{width:100%;height:40px;border:0;border-radius:12px;background:var(--soft);padding:0 12px 0 34px;font-size:15px;outline:none}
  .search input:focus{box-shadow:0 0 0 2px var(--ink) inset}
  .search::before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-52%);color:var(--sub);font-size:17px}

  .filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fbtn{flex:none;height:32px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:0 12px;font-size:13px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px}
  .fbtn::after{content:"▾";font-size:10px;color:var(--sub);transition:transform .2s}
  .fbtn.open::after{transform:rotate(180deg)}
  .fbtn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .fbtn.active::after{color:#fff}
  .fbtn.clear{border:0;background:none;color:var(--sub);padding:0 6px}
  .fbtn.clear::after{content:none}

  #fpanel{display:none;margin-top:8px;padding:10px;border-radius:12px;background:var(--soft)}
  #fpanel.show{display:block}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:0;background:#fff;border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer;box-shadow:0 0 0 1px var(--line) inset}
  .chip b{font-weight:500;color:var(--sub);margin-left:3px;font-size:11px}
  .chip.on{background:var(--ink);color:#fff;box-shadow:none}
  .chip.on b{color:#ccc}
  .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

  #list{flex:1;overflow-y:auto;padding:8px 10px calc(16px + env(safe-area-inset-bottom));overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .empty{color:var(--sub);text-align:center;padding:30px 0;font-size:14px}
  .card{border-radius:14px;padding:10px;display:grid;grid-template-columns:64px 1fr;gap:12px;cursor:pointer;transition:background .15s}
  .card:hover{background:var(--soft)}
  .card.sel{background:var(--soft)}
  .card img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--line)}
  .name{font-weight:650;font-size:14.5px;display:flex;justify-content:space-between;gap:6px;line-height:1.35}
  .star{flex:none;cursor:pointer;color:#d4d4d0;font-size:18px;line-height:1;padding:0 2px}
  .star.on{color:#f5a400}
  .meta{font-size:12px;color:var(--sub);margin:3px 0 5px;display:flex;align-items:center;gap:5px}
  .meta i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .offer{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:650;font-size:12.5px;padding:3px 8px;border-radius:7px}
  .detail{grid-column:1/-1;font-size:13px;line-height:1.6;display:none;padding:2px 2px 4px}
  .card.sel .detail{display:block}
  .detail h4{margin:10px 0 2px;font-size:12px;color:var(--sub);font-weight:600}
  .detail p{margin:0;white-space:pre-line}
  .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .links a{font-size:13px;text-decoration:none;border-radius:10px;padding:8px 12px;color:var(--ink);background:#fff;box-shadow:0 0 0 1px var(--line) inset}
  .links a.primary{background:var(--ink);color:#fff;box-shadow:none}
  .warn{color:#b45309;font-size:12px;margin-top:8px!important}

  .pin{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .pin.fav{width:18px;height:18px;border-color:#f5a400;border-width:3px}
  .pin.sel{width:22px;height:22px;border-width:3px;box-shadow:0 0 0 4px rgba(0,0,0,.18)}
  .leaflet-popup-content{font-size:13px;margin:10px 12px}

  @media (min-width:801px){
    #side{top:12px;left:12px;bottom:12px;width:400px;border-radius:var(--radius)}
  }
  @media (max-width:800px){
    #side{left:0;right:0;bottom:0;border-radius:var(--radius) var(--radius) 0 0;height:50vh;will-change:height}
    #side.anim{transition:height .28s cubic-bezier(.2,.8,.2,1)}
    .grip{display:block}
    #head{padding-top:4px;cursor:grab}
    .titlebar{margin:0 0 8px}
    .leaflet-control-zoom{display:none}
  }
</style>
</head>
<body>
<div id="map"></div>

<aside id="side">
  <div id="head">
    <div class="grip"></div>
    <div class="titlebar">
      <h1>간사이 조이패스<small id="count"></small></h1>
      <div class="tools">
        <button class="ibtn" id="favOnly" title="즐겨찾기만">★</button>
        <button class="ibtn" id="locate" title="내 위치">◎</button>
      </div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="이름·혜택·주소 검색" autocomplete="off"></div>
    <div class="filters" id="fbtns"></div>
    <div id="fpanel"><div class="chips" id="chips"></div></div>
  </div>
  <div id="list"></div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
// 시설 데이터는 Actions(fetch-kansai)가 매주 갱신하는 data.json 에서 읽는다
async function main(){
const json = await (await fetch('data.json', {cache:'no-cache'})).json();
const DATA = json.items;
const BASIS = (d=>isNaN(d)?'':` · ${d.getMonth()+1}/${d.getDate()} 기준`)(new Date(json.updatedAt));

const REGION = {osaka:'오사카',kyoto:'교토',hyogo:'효고(고베)',shiga:'시가',nara:'나라',wakayama:'와카야마',aichi:'아이치'};
const GENRE = {
  food:['맛집','#e8590c'], attractions:['명소','#1c7ed6'], experience:['체험','#7048e8'],
  shopping:['쇼핑','#2f9e44'], transportation:['교통','#495057']
};
const SUB = {'japanese-bbq':'야키니쿠','izakaya':'이자카야','japanese-cuisine':'일식','hot-pot':'나베·샤부샤부',
  'skewers':'꼬치구이','seafood':'해산물','sushi':'스시','international-cuisine':'이국요리','desserts':'디저트','others':'기타'};
const GROUPS = [
  {key:'region', label:'지역', map:REGION, has:(d,k)=>d.region===k},
  {key:'genre',  label:'카테고리', map:GENRE, has:(d,k)=>d.types.includes(k)},
  {key:'sub',    label:'음식종류', map:SUB, has:(d,k)=>d.types.includes(k)},
];

DATA.forEach((d,i)=>{
  d.id=i;
  d.genre=Object.keys(GENRE).find(g=>d.types.includes(g)) || 'attractions';
  d.offer=d.offer || d.desc.slice(0,40);
});

const state={region:new Set(),genre:new Set(),sub:new Set(),q:'',favOnly:false,sel:null,open:null};
const FAV_KEY='joypass-kansai-fav';
const favs=new Set(JSON.parse(localStorage.getItem(FAV_KEY)||'[]'));
const saveFav=()=>localStorage.setItem(FAV_KEY,JSON.stringify([...favs]));
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isMobile=()=>matchMedia('(max-width:800px)').matches;
const $=id=>document.getElementById(id);

// ---------- 지도 ----------
const map=L.map('map',{zoomControl:false}).setView([34.69,135.50],12);
L.control.zoom({position:'bottomright'}).addTo(map);
// 키 없이 쓰는 타일 3종. 하나가 막히면 우측 상단에서 전환
const BASE={
  '구글 지도(한국어)':L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&hl=ko&x={x}&y={y}&z={z}',{maxZoom:20,subdomains:'0123',attribution:'&copy; Google'}),
  '일본 국토지리원':L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; 国土地理院'}),
  'Esri 거리지도':L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'&copy; Esri'})
};
const BASE_KEY='joypass-kansai-base';
(BASE[localStorage.getItem(BASE_KEY)]||BASE['구글 지도(한국어)']).addTo(map);
L.control.layers(BASE,null,{position:'topright'}).addTo(map);
map.on('baselayerchange',e=>localStorage.setItem(BASE_KEY,e.name));

const cluster=L.markerClusterGroup({disableClusteringAtZoom:16,maxClusterRadius:40,showCoverageOnHover:false});
map.addLayer(cluster);
const markers={};
const icon=d=>L.divIcon({className:'',html:`<div class="pin${favs.has(d.url)?' fav':''}${state.sel===d.id?' sel':''}" style="background:${GENRE[d.genre][1]}"></div>`,iconSize:[22,22],iconAnchor:[11,11]});
DATA.forEach(d=>{
  const m=L.marker([d.lat,d.lng],{icon:icon(d)});
  m.on('click',()=>select(d.id,{fromMap:true}));
  markers[d.id]=m;
});

function gmapUrl(d){
  if(d.gmap) return d.gmap;
  const q=d.address && !d.address.startsWith('http') ? d.address.split('\n')[0] : `${d.lat},${d.lng}`;
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
}

// ---------- 필터 ----------
function match(d,skip){
  for(const g of GROUPS){
    if(g.key===skip) continue;
    const set=state[g.key];
    if(set.size && ![...set].some(k=>g.has(d,k))) return false;
  }
  if(state.favOnly && !favs.has(d.url)) return false;
  if(state.q){
    const hay=(d.name+' '+d.offer+' '+d.howto+' '+d.address+' '+d.desc+' '+(REGION[d.region]||'')+' '+d.types.map(t=>SUB[t]||GENRE[t]?.[0]||'').join(' ')).toLowerCase();
    if(!state.q.split(/\s+/).every(w=>hay.includes(w))) return false;
  }
  return true;
}

function renderFilters(){
  const subUsable=!state.genre.size||state.genre.has('food');
  if(!subUsable) state.sub.clear();
  const any=GROUPS.some(g=>state[g.key].size);
  $('fbtns').innerHTML=GROUPS.filter(g=>g.key!=='sub'||subUsable).map(g=>{
    const set=state[g.key];
    const name=set.size===1?(([v])=>Array.isArray(g.map[v])?g.map[v][0]:g.map[v])([...set]):set.size?`${g.label} ${set.size}`:g.label;
    return `<button class="fbtn${set.size?' active':''}${state.open===g.key?' open':''}" data-g="${g.key}">${esc(name)}</button>`;
  }).join('')+(any?'<button class="fbtn clear" data-clear>초기화</button>':'');

  const g=GROUPS.find(x=>x.key===state.open);
  $('fpanel').classList.toggle('show',!!g);
  if(!g) return;
  $('chips').innerHTML=Object.entries(g.map).map(([k,v])=>{
    const n=DATA.filter(d=>g.has(d,k)&&match(d,g.key)).length;
    if(!n&&!state[g.key].has(k)) return '';
    const label=Array.isArray(v)?v[0]:v, color=Array.isArray(v)?v[1]:null;
    return `<button class="chip${state[g.key].has(k)?' on':''}" data-k="${k}">${color?`<span class="dot" style="background:${color}"></span>`:''}${label}<b>${n}</b></button>`;
  }).join('');
}

$('fbtns').addEventListener('click',e=>{
  if(e.target.closest('[data-clear]')){GROUPS.forEach(g=>state[g.key].clear());state.open=null;render();return;}
  const b=e.target.closest('[data-g]'); if(!b) return;
  state.open=state.open===b.dataset.g?null:b.dataset.g;
  if(state.open && isMobile() && sheet.snap==='peek') sheet.set('half');
  renderFilters();
});
$('chips').addEventListener('click',e=>{
  const c=e.target.closest('[data-k]'); if(!c) return;
  const set=state[state.open]; set.has(c.dataset.k)?set.delete(c.dataset.k):set.add(c.dataset.k);
  render();
});

// ---------- 목록 ----------
function cardHtml(d){
  const types=d.types.map(t=>SUB[t]||GENRE[t]?.[0]).filter(Boolean).join(' · ');
  return `<div class="card${state.sel===d.id?' sel':''}" data-id="${d.id}">
    <img loading="lazy" src="${esc(d.img)}" alt="">
    <div>
      <div class="name"><span>${esc(d.name)}</span><span class="star${favs.has(d.url)?' on':''}" data-fav="${d.id}">★</span></div>
      <div class="meta"><i style="background:${GENRE[d.genre][1]}"></i>${REGION[d.region]||d.region} · ${types}</div>
      <span class="offer">${esc(d.offer)}</span>
    </div>
    <div class="detail">
      ${d.desc?`<p>${esc(d.desc)}</p>`:''}
      ${d.howto?`<h4>이용 방법 · 주의사항</h4><p>${esc(d.howto.replace(/\n{2,}/g,'\n'))}</p>`:''}
      ${d.address?`<h4>교환 장소</h4><p>${esc(d.address)}</p>`:''}
      ${d.approx?`<p class="warn">※ 지도 위치는 대략적인 위치입니다(${esc(d.approx)} 기준)</p>`:''}
      <div class="links">
        <a class="primary" href="${esc(gmapUrl(d))}" target="_blank">📍 구글 지도</a>
        <a href="${esc(d.url)}" target="_blank">상세 페이지</a>
        ${d.site?`<a href="${esc(d.site)}" target="_blank">공식 홈페이지</a>`:''}
      </div>
    </div>
  </div>`;
}

function render(){
  renderFilters();
  $('favOnly').classList.toggle('on',state.favOnly);
  const rows=DATA.filter(d=>match(d));
  $('count').textContent=`${rows.length}곳${BASIS}`;
  $('list').innerHTML=rows.length?rows.map(cardHtml).join(''):'<div class="empty">조건에 맞는 시설이 없습니다</div>';
  cluster.clearLayers();
  rows.forEach(d=>{markers[d.id].setIcon(icon(d));cluster.addLayer(markers[d.id]);});
}

// 선택된 마커를 시트에 가리지 않는 위치로 이동
function focusMarker(id){
  const m=markers[id];
  cluster.zoomToShowLayer(m,()=>{
    const mapH=map.getSize().y, visible=isMobile()?$('side').offsetHeight:0;
    const p=map.latLngToContainerPoint(m.getLatLng());
    const tx=isMobile()?map.getSize().x/2:(412+(map.getSize().x-412)/2);
    map.panBy([p.x-tx,p.y-(mapH-visible)/2],{animate:true});
  });
}

function select(id,{fromMap=false}={}){
  const toggleOff=state.sel===id&&!fromMap;
  const prev=state.sel;
  state.sel=toggleOff?null:id;
  // 목록 전체를 다시 그리지 않고 선택 상태만 갱신
  document.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel'));
  [prev,state.sel].forEach(i=>{if(i!=null&&markers[i]) markers[i].setIcon(icon(DATA[i]));});
  if(state.sel==null) return;
  let el=$('list').querySelector(`.card[data-id="${id}"]`);
  if(!el){ // 필터에 걸려 숨겨진 시설이면 필터 해제
    GROUPS.forEach(g=>state[g.key].clear());state.q='';$('q').value='';state.favOnly=false;render();
    el=$('list').querySelector(`.card[data-id="${id}"]`);
  }
  el.classList.add('sel');
  if(isMobile() && sheet.snap==='peek') sheet.set('half');
  setTimeout(()=>el.scrollIntoView({block:'start',behavior:'smooth'}),fromMap?300:0);
  setTimeout(()=>focusMarker(id),fromMap?0:320);
}

$('list').addEventListener('click',e=>{
  const f=e.target.closest('[data-fav]');
  if(f){
    const d=DATA[+f.dataset.fav];
    favs.has(d.url)?favs.delete(d.url):favs.add(d.url);saveFav();
    f.classList.toggle('on',favs.has(d.url));markers[d.id].setIcon(icon(d));
    if(state.favOnly) render();
    return;
  }
  if(e.target.closest('a')) return;
  const c=e.target.closest('.card'); if(c) select(+c.dataset.id);
});
$('q').addEventListener('input',()=>{state.q=$('q').value.trim().toLowerCase();render();});
$('q').addEventListener('focus',()=>{if(isMobile()&&sheet.snap!=='full') sheet.set('full');});
$('favOnly').onclick=()=>{state.favOnly=!state.favOnly;render();};
$('locate').onclick=()=>map.locate({setView:true,maxZoom:15});
let me;
map.on('locationfound',e=>{if(me) map.removeLayer(me);me=L.circleMarker(e.latlng,{radius:8,color:'#1c7ed6',fillOpacity:.6}).addTo(map);if(isMobile()) sheet.set('peek');});
map.on('locationerror',()=>alert('위치를 가져올 수 없습니다. 브라우저 위치 권한을 확인해 주세요.'));

// ---------- 모바일 바텀시트 ----------
const sheet={
  snap:'half',
  heights(){
    const H=window.innerHeight;
    return {peek:Math.min($('head').offsetHeight+6,H*0.45),half:Math.round(H*0.52),full:H-48};
  },
  set(s,anim=true){
    if(!isMobile()){$('side').style.height='';return;}
    this.snap=s;
    const el=$('side');
    el.classList.toggle('anim',anim);
    el.style.height=this.heights()[s]+'px';
  },
  nearest(h,v){
    const hs=this.heights();
    // 빠르게 튕기면 그 방향 다음 단계로
    const order=['peek','half','full'];
    if(Math.abs(v)>0.5){
      const cur=order.indexOf(this.snap);
      return order[Math.max(0,Math.min(2,cur+(v>0?1:-1)))];
    }
    return order.reduce((a,b)=>Math.abs(hs[b]-h)<Math.abs(hs[a]-h)?b:a);
  }
};

(function dragSheet(){
  const el=$('side'), list=$('list');
  let drag=null;
  const start=(y,from)=>{drag={y0:y,h0:el.offsetHeight,t0:performance.now(),y1:y,t1:performance.now(),from,moved:false};el.classList.remove('anim');};
  const move=y=>{
    const dy=drag.y0-y;
    if(Math.abs(dy)>4) drag.moved=true;
    const hs=sheet.heights();
    el.style.height=Math.max(hs.peek*0.8,Math.min(hs.full,drag.h0+dy))+'px';
    const now=performance.now(); drag.v=(drag.y1-y)/Math.max(1,now-drag.t1); drag.y1=y; drag.t1=now;
  };
  const end=()=>{
    if(!drag) return;
    if(!drag.moved && drag.from==='head') sheet.set(sheet.snap==='full'?'half':sheet.snap==='half'?'full':'half');
    else sheet.set(sheet.nearest(el.offsetHeight,drag.v||0));
    drag=null;
  };

  // 헤더 영역: 어디를 잡아도 드래그(입력창·버튼 제외)
  $('head').addEventListener('touchstart',e=>{
    if(!isMobile()||e.target.closest('input,button')) return;
    start(e.touches[0].clientY,'head');
  },{passive:true});
  // 목록: 맨 위에서 아래로 당기면 시트를 내림, 시트가 덜 펼쳐졌으면 위로 밀어 올림
  let ly=null;
  list.addEventListener('touchstart',e=>{ly=e.touches[0].clientY;},{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!isMobile()) return;
    const y=e.touches[0].clientY;
    if(!drag && ly!=null){
      const dy=y-ly;
      if((list.scrollTop<=0 && dy>6) || (sheet.snap!=='full' && dy<-6)) start(ly,'list');
    }
    if(drag){e.preventDefault();move(y);}
  },{passive:false});
  document.addEventListener('touchend',()=>{ly=null;end();});
  document.addEventListener('touchcancel',()=>{ly=null;end();});
})();

window.addEventListener('resize',()=>sheet.set(sheet.snap,false));
map.on('click',()=>{if(state.open){state.open=null;renderFilters();} else if(isMobile()&&sheet.snap==='full') sheet.set('half');});

render();
sheet.set('half',false);
}
main().catch(()=>{document.getElementById('list').innerHTML='<div class="empty">시설 정보를 불러오지 못했습니다</div>';});
</script>
</body>
</html>
