<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>이번 주 식단</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --ink: #1d1b18;
    --muted: #7a746a;
    --line: #e6e1d6;
    --accent: #d9480f;
    --accent-soft: #fff4ec;
    --head: #efeae0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151412;
      --surface: #1f1d1a;
      --ink: #f2efe8;
      --muted: #9b958a;
      --line: #2e2b27;
      --accent: #ff8a4c;
      --accent-soft: #2a1f17;
      --head: #262420;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .range { color: var(--muted); font-size: 13px; }

  /* 주간 표: 좁은 화면에선 가로 스크롤, 첫 열·머리 행 고정 */
  .scroller {
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    border: 1px solid var(--line); border-radius: 16px; background: var(--surface);
  }
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 820px; table-layout: fixed; }
  col.label { width: 76px; }
  th, td { border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
  td + td, th + th { border-left: 1px solid var(--line); }
  tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }

  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--head); padding: 10px 12px; font-size: 14px; font-weight: 800;
  }
  thead th .dt { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 4px; }
  thead th.today { background: var(--accent); color: #fff; }
  thead th.today .dt { color: inherit; opacity: .8; }

  th.row {
    position: sticky; left: 0; z-index: 1;
    background: var(--surface); padding: 12px 10px; font-size: 12px; font-weight: 700; color: var(--muted);
  }
  thead th.corner-head { left: 0; z-index: 3; }
  th.row .meal { display: block; color: var(--ink); font-size: 13px; font-weight: 800; }

  tr.meal-start > * { border-top: 2px solid var(--ink); }
  tbody tr.meal-start:first-child > * { border-top: 0; }

  td { padding: 12px; font-size: 13px; }
  td.today { background: var(--accent-soft); }
  .name { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; }
  .sides { color: var(--muted); margin: 0; padding: 0; list-style: none; word-break: keep-all; }
  .sides .plus { color: var(--accent); font-weight: 600; }

  /* 한 주 내내 같은 메뉴는 한 칸으로 합쳐 흐리게 */
  tr.constant th.row, tr.constant td { padding-top: 8px; padding-bottom: 8px; }
  tr.constant td { color: var(--muted); font-size: 12px; }
  tr.constant td .same { margin-left: 6px; font-size: 11px; opacity: .8; }
  .kcal { display: inline-block; margin-top: 6px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .none { color: var(--muted); }

  .notice { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .notice.stale { padding: 10px 14px; margin: 0 0 12px; background: var(--accent-soft); color: var(--accent); border-radius: 12px; text-align: left; font-size: 13px; }
  footer { margin-top: 16px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>이번 주 식단</h1>
    <span class="range" id="range"></span>
  </header>
  <div id="stale"></div>
  <div id="board"><p class="notice">불러오는 중…</p></div>
  <footer id="updated"></footer>
</div>

<script>
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const MEAL_ORDER = ['조식', '중식', '석식'];
// 이보다 낮은 열량은 실제 값이 아니라 자리표시라 감춘다 (간편식 24kcal 등)
const MIN_KCAL = 50;

const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text != null) node.textContent = text;
  return node;
}

// KST 기준 오늘 yyyymmdd
function todayKst() {
  return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10).replace(/-/g, '');
}
const dowOf = (ymd) => DOW[new Date(Date.UTC(+ymd.slice(0, 4), +ymd.slice(4, 6) - 1, +ymd.slice(6, 8))).getUTCDay()];
const md = (ymd) => `${+ymd.slice(4, 6)}/${+ymd.slice(6, 8)}`;

// "메뉴명, b,  , PLUS)c" → 반찬 목록. 빈 칸은 뺀다.
// 메뉴명은 쪼개기 전에 앞에서 떼어 낸다 - '토스트2종&잼,버터' 처럼 이름에 쉼표가 들어 있기도 하다.
function sides(item) {
  let detail = item.detail.trim();
  if (item.name && detail.startsWith(item.name)) detail = detail.slice(item.name.length);
  return detail.split(',').map((s) => s.trim()).filter(Boolean);
}

// 표의 행 = (식사, 코너) 쌍. 식사는 조식→중식→석식, 코너는 나온 차례대로.
function rowsOf(days) {
  const seen = new Map();
  for (const list of Object.values(days)) {
    for (const x of list) {
      const key = x.meal + '|' + x.corner;
      if (!seen.has(key)) seen.set(key, { meal: x.meal, corner: x.corner });
    }
  }
  const rank = (m) => (MEAL_ORDER.indexOf(m) + 1) || 99;
  return [...seen.values()].map((r, i) => ({ ...r, i }))
    .sort((a, b) => rank(a.meal) - rank(b.meal) || a.i - b.i);
}

// 요일이 둘 이상이고 모든 날 메뉴명·상세가 같으면 '매일 동일' 행이다
function isConstant(items) {
  return items.length > 1 && items.every((x) => x && x.name === items[0].name && x.detail === items[0].detail);
}

function cell(item) {
  const td = el('td');
  if (!item) {
    td.append(el('span', { class: 'none' }, '—'));
    return td;
  }
  td.append(el('p', { class: 'name' }, item.name));
  const list = sides(item);
  if (list.length) {
    const ul = el('ul', { class: 'sides' });
    for (const s of list) {
      const plus = /^PLUS\)/i.test(s);
      ul.append(el('li', plus ? { class: 'plus' } : {}, plus ? '+' + s.replace(/^PLUS\)/i, '') : s));
    }
    td.append(ul);
  }
  if (Number(item.kcal) >= MIN_KCAL) td.append(el('span', { class: 'kcal' }, `${Math.round(item.kcal).toLocaleString()} kcal`));
  return td;
}

function render(data) {
  const keys = Object.keys(data.days).sort();
  const today = todayKst();
  const rows = rowsOf(data.days);

  const table = el('table');
  const colgroup = el('colgroup');
  colgroup.append(el('col', { class: 'label' }));
  keys.forEach(() => colgroup.append(el('col')));
  table.append(colgroup);

  const headRow = el('tr');
  headRow.append(el('th', { class: 'row corner-head' }));
  for (const ymd of keys) {
    const th = el('th', ymd === today ? { class: 'today' } : {}, dowOf(ymd));
    th.append(el('span', { class: 'dt' }, md(ymd)));
    headRow.append(th);
  }
  const thead = el('thead');
  thead.append(headRow);
  table.append(thead);

  const tbody = el('tbody');
  let prevMeal = null;
  for (const r of rows) {
    const tr = el('tr', r.meal !== prevMeal ? { class: 'meal-start' } : {});
    const th = el('th', { class: 'row', scope: 'row' });
    if (r.meal !== prevMeal) th.append(el('span', { class: 'meal' }, r.meal));
    th.append(r.corner);
    tr.append(th);
    const items = keys.map((ymd) => (data.days[ymd] || []).find((x) => x.meal === r.meal && x.corner === r.corner));
    if (isConstant(items)) {
      // 매일 같은 메뉴(C Course 간편식 등)는 요일마다 반복하지 않고 한 칸에 흐리게 적는다
      tr.classList.add('constant');
      const td = el('td', { colspan: keys.length }, items[0].name);
      td.append(el('span', { class: 'same' }, '(매일 동일)'));
      tr.append(td);
    } else {
      items.forEach((item, i) => {
        const td = cell(item);
        if (keys[i] === today) td.classList.add('today');
        tr.append(td);
      });
    }
    tbody.append(tr);
    prevMeal = r.meal;
  }
  table.append(tbody);

  const scroller = el('div', { class: 'scroller' });
  scroller.append(table);
  $('board').replaceChildren(scroller);

  // 좁은 화면에서 오늘 열이 보이도록 가로 스크롤을 맞춘다
  const todayHead = table.querySelector('thead th.today');
  if (todayHead && scroller.scrollWidth > scroller.clientWidth) {
    // 고정 첫 열(76px)에 가리지 않게 그만큼 덜 민다
    scroller.scrollLeft = todayHead.offsetLeft - 76;
  }
}

async function init() {
  let data;
  try {
    const res = await fetch('menu.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    $('board').replaceChildren(el('p', { class: 'notice' }, '식단을 불러오지 못했습니다'));
    return;
  }

  const keys = Object.keys(data.days || {}).sort();
  if (!keys.length) {
    $('board').replaceChildren(el('p', { class: 'notice' }, '식단 정보가 없습니다'));
    return;
  }
  $('range').textContent = `${md(keys[0])} – ${md(keys[keys.length - 1])}`;

  // 오늘이 이번 데이터 주간보다 뒤면 아직 갱신 전이다
  if (todayKst() > keys[keys.length - 1]) {
    $('stale').append(el('p', { class: 'notice stale' }, '지난 주 식단입니다. 이번 주 식단은 아직 갱신되지 않았어요.'));
  }

  const upd = new Date(data.updatedAt);
  $('updated').textContent = isNaN(upd) ? '' : `업데이트 ${upd.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`;

  render(data);
}

init();
</script>
</body>
</html>
